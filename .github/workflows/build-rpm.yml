name: Build RPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y rpm rsync imagemagick fonts-dejavu-core

      - name: Prepare store assets
        run: |
          convert todoapp.png -resize 172x172! store-icon-172.png
          convert todoapp.png -resize 512x512! store-icon-512.png
          BG=$(convert todoapp.png -resize 1x1! -format '%[pixel:p{0,0}]' info:)
          convert -size 1024x512 xc:"$BG" \
            \( todoapp.png -resize 300x300! \) -gravity north -geometry +0+30 -composite \
            -font DejaVu-Sans -pointsize 80 -fill white -gravity south -annotate +0+20 'Todo' \
            store-cover.png
          for f in *.png; do
            case "$f" in todoapp.png|store-icon-172.png|store-icon-512.png|store-cover.png) continue;; esac
            convert "$f" -resize 1080x1920^ -gravity center -extent 1080x1920 "store-screenshot-$f"
          done
          ls -l store-*.png

      - name: Stage sources and build RPM
        run: |
          VERSION=0.2
          mkdir -p rpmbuild/BUILD rpmbuild/RPMS rpmbuild/SOURCES rpmbuild/SPECS rpmbuild/SRPMS
          mkdir -p stage/harbour-todoapp-${VERSION}/qml stage/harbour-todoapp-${VERSION}/icons
          rsync -a --exclude='*.bak*' qml/ stage/harbour-todoapp-${VERSION}/qml/
          cp packaging/harbour-todoapp.desktop stage/harbour-todoapp-${VERSION}/
          convert todoapp.png -resize 86x86! stage/harbour-todoapp-${VERSION}/icons/harbour-todoapp-86.png
          convert todoapp.png -resize 108x108! stage/harbour-todoapp-${VERSION}/icons/harbour-todoapp-108.png
          convert todoapp.png -resize 128x128! stage/harbour-todoapp-${VERSION}/icons/harbour-todoapp-128.png
          convert todoapp.png -resize 172x172! stage/harbour-todoapp-${VERSION}/icons/harbour-todoapp-172.png
          cp rpm/harbour-todoapp.spec rpmbuild/SPECS/
          tar -czf rpmbuild/SOURCES/harbour-todoapp-${VERSION}.tar.gz -C stage harbour-todoapp-${VERSION}
          rpmbuild -bb --define "_topdir ${PWD}/rpmbuild" rpmbuild/SPECS/harbour-todoapp.spec
          cp rpmbuild/RPMS/noarch/*.rpm .
          ls -l harbour-todoapp-*.rpm

      - name: Upload RPM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-todoapp-rpm
          path: harbour-todoapp-*.rpm

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.2 --title "Todo v0.2 (Harbour-ready)" --notes "Harbour-klar .rpm-pakke til Sailfish OS." harbour-todoapp-*.rpm store-icon-172.png store-icon-512.png store-cover.png store-screenshot-*.png \
            || gh release upload v0.2 harbour-todoapp-*.rpm store-icon-172.png store-icon-512.png store-cover.png store-screenshot-*.png --clobber
